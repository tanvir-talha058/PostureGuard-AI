[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "postureguard"
version = "0.1.0"
description = "Real-time webcam posture tracking and correction. Runs entirely on your machine."
requires-python = ">=3.10"
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.9",
    "PySide6>=6.6",
    "numpy>=1.26",
    "anthropic>=0.120.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16"]

[project.scripts]
postureguard = "postureguard.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
    "RUF001",  # the "x" in "1.5x" is a deliberate typographic multiplication sign, not a typo
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]  # fixture defaults use frozen dataclasses, not mutable state
